<!DOCTYPE html>
<html>

    <head>
        <title>Hackathon Website</title>
    </head>

    <script src="https://cdn.jsdelivr.net/gh/theGreski/AzimuthJS@2.0.1/dist/azimuth.min.js" defer></script>

    <body>
        <style>
            body{
                width: 100vw; 
                height: 100vh;
                background-image: url('assets/art/bg.png');
                background-size: 100% 100%;
                background-position: center;
                font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            }
            #name{
                border-radius: 15px;
                border-width: 4px;
                border-color: black;
                border-style: solid;
                width: 200px;
                height: 40px;
                font-size: 20px;
                background-color: white;
                text-align: center;
            }
            #submitButton:hover, #cb:hover {
                box-shadow: 0px 0px 15px 8px black;
            }
            #submitButton, #cb{
                box-shadow: none;
                transition: box-shadow 0.3s ease-in-out;
                border-radius: 15px;
                border-width: 4px;
                border-color: black;
                border-style: solid;
                width: 200px;
                height: 80px;
                font-size: 22px;
                background-color: grey;
                font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            }
            #httlogo{
                position: absolute;
                float: right;
                align-items: center;
                display: flex;
                flex-direction: column;
                font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
                color: black;
                background-color: rgba(255, 255, 255, 0.25);
                border-radius: 20px;
                width: 300px;
                height: 205px;
                padding-left: 5px;
                padding-right: 5px;
                padding-top: 25px;
                margin-right: 75px;
                margin-top: 25px;
                font-size: 19px;
            }
            #arrowdiv{
                float: center;
                align-self: center;
                align-content: center;
            }
        </style>
        <!-- https://www.joshwcomeau.com/css/center-a-div/ -->
         <div id="httlogo">
            <img src="/assets/art/httlogo.png" id="logoer" style = "width: auto; height: 80%">
            <p>Made for Hack the Track</p>
         </div>
        <div style = "display: flex; width: 100%; height: 100%; justify-content: center; align-items: center;">
            <div style = "display: flex; flex-direction: column; transform: scale(2); align-self: center; align-items: center; justify-self: center; align-content: center; justify-content: center;">
                <img src = "/assets/art/title.png" style = "width: 300px; height: auto">
                <input id="name" type = "text">
                <button onclick="submitName();" id="submitButton">Submit</button>
                <button onclick="reqqq();" id="cb">Calibrate arrow</button>
                <p id = "nearest">NOBODY NEAR YOU</p>
                <p id="arrownotes"></p>

                <p id="errors"></p>
                <div id="arrowdiv">
                    <img id = "arrow" src = "/assets/art/arrow.png" style = "position: absolute; width: 100px; height: 100px; transform: translate(-50%, -0%)">
                    <img id = "north" src = "/assets/art/arrow.png" style = "opacity: 0.3; position: absolute; width: 100px; height: 100px; transform: translate(-50%, -0%)">
                </div>

            </div>
        </div>
    </body>

    <script src = "./js"></script>

</html>
